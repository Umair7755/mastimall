  </g>
  <!-- Décor orb -->
  <circle cx="520" cy="430" r="38" fill="#C4B5FD" filter="url(#soft)"/>
  <!-- Décor ring -->
  <g transform="translate(430 90)" filter="url(#soft)">
    <circle cx="40" cy="40" r="34" fill="none" stroke="#FDE68A" stroke-width="16"/>
  </g>

  <!-- Toy blocks with faces -->
  <g transform="translate(150 120) rotate(-12 90 90)" filter="url(#soft)">
    <rect width="180" height="180" rx="36" fill="#4338CA"/>
