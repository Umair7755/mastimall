    <circle cx="60" cy="70" r="7" fill="#0f172a"/>
    <circle cx="120" cy="70" r="7" fill="#0f172a"/>
  </g>
  <g transform="translate(280 260) rotate(10 80 80)" filter="url(#soft)">
