<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="g" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EEF0FF"/>
      <stop offset="55%" stop-color="#FFE8C8"/>
      <stop offset="100%" stop-color="#FFD6E5"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#g)" rx="48"/>

  <!-- Décor cushion -->
  <g transform="translate(90 430) rotate(-8)" filter="url(#soft)">
    <rect width="170" height="70" rx="28" fill="#A7F3D0"/>
  </g>
  <!-- Décor vase -->
