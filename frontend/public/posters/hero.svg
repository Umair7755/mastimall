  </g>

  <!-- Sparkles -->
  <g fill="#FBBF24">
    <path d="M90 110 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z"/>
    <path d="M560 160 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
    <path d="M330 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
