    <circle cx="108" cy="62" r="14" fill="#fff"/>
    <circle cx="52" cy="62" r="6" fill="#0f172a"/>
    <circle cx="108" cy="62" r="6" fill="#0f172a"/>
  </g>
  <g transform="translate(400 140) rotate(14 70 70)" filter="url(#soft)">
